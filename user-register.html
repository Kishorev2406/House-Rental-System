<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Register — House Rental System</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css"/>
  <link rel="stylesheet" href="style.css"/>
</head>
<body style="background:linear-gradient(135deg,#0f172a 0%,#1e3a5f 100%);min-height:100vh;padding:40px 0">

<div class="container">
  <div class="row justify-content-center">
    <div class="col-lg-8">
      <div class="form-card">
        <div class="form-header">
          <i class="bi bi-person-plus-fill" style="font-size:40px;color:#f59e0b;display:block;margin-bottom:12px"></i>
          <h2>Create Tenant Account</h2>
          <p>Join House Rental System and find your perfect rental home</p>
        </div>
        <div class="form-body">
          <a href="index.html" style="font-size:13px;color:#64748b"><i class="bi bi-arrow-left me-1"></i>Back to Home</a>
          <div id="alertBox" class="mt-3"></div>

          <form id="regForm" novalidate class="mt-3">
            <div class="row g-3">
              <div class="col-md-6">
                <label class="form-label">Full Name *</label>
                <input type="text" class="form-control" id="rName" placeholder="Your full name" required/>
              </div>
              <div class="col-md-6">
                <label class="form-label">Username *</label>
                <input type="text" class="form-control" id="rUsername" placeholder="Choose a username" required/>
              </div>
              <div class="col-md-6">
                <label class="form-label">Email Address *</label>
                <input type="email" class="form-control" id="rEmail" placeholder="your@email.com" required/>
              </div>
              <div class="col-md-6">
                <label class="form-label">Phone Number *</label>
                <input type="tel" class="form-control" id="rPhone" placeholder="10-digit mobile" maxlength="10" required/>
              </div>
              <div class="col-md-6">
                <label class="form-label">Gender *</label>
                <select class="form-select" id="rGender" required>
                  <option value="">Select Gender</option>
                  <option>Male</option>
                  <option>Female</option>
                  <option>Other</option>
                </select>
              </div>
              <div class="col-md-6">
                <label class="form-label">Date of Birth *</label>
                <input type="date" class="form-control" id="rDob" required/>
              </div>
              <div class="col-md-6">
                <label class="form-label">District *</label>
                <select class="form-select" id="rDistrict" required></select>
              </div>
              <div class="col-md-6">
                <label class="form-label">City / Town</label>
                <input type="text" class="form-control" id="rCity" placeholder="Your city"/>
              </div>
              <div class="col-12">
                <label class="form-label">Address</label>
                <input type="text" class="form-control" id="rAddress" placeholder="Your full address"/>
              </div>
              <div class="col-md-6">
                <label class="form-label">Password *</label>
                <div class="input-group">
                  <input type="password" class="form-control" id="rPassword" placeholder="Min 6 characters" required/>
                  <button type="button" class="input-group-text" onclick="togglePwd('rPassword','ico1')"><i class="bi bi-eye-slash" id="ico1"></i></button>
                </div>
              </div>
              <div class="col-md-6">
                <label class="form-label">Confirm Password *</label>
                <div class="input-group">
                  <input type="password" class="form-control" id="rCPassword" placeholder="Re-enter password" required/>
                  <button type="button" class="input-group-text" onclick="togglePwd('rCPassword','ico2')"><i class="bi bi-eye-slash" id="ico2"></i></button>
                </div>
              </div>
              <div class="col-12">
                <label class="form-label">Profile Picture (Optional)</label>
                <input type="file" class="form-control" id="rPic" accept="image/*" onchange="previewPic(this)"/>
                <div class="mt-2" id="picPreview"></div>
              </div>
              <div class="col-12">
                <div class="form-check">
                  <input class="form-check-input" type="checkbox" id="rTerms" required/>
                  <label class="form-check-label" style="font-size:13px" for="rTerms">I agree to the <a href="#" style="color:#2563eb">Terms & Conditions</a> and <a href="#" style="color:#2563eb">Privacy Policy</a></label>
                </div>
              </div>
              <div class="col-12">
                <button type="submit" class="btn btn-primary w-100 btn-lg" id="regBtn">
                  <i class="bi bi-person-check me-2"></i>Create Account
                </button>
              </div>
            </div>
          </form>

          <div class="text-center mt-4">
            <p style="font-size:13px;color:#64748b">Already have an account? <a href="login.html" style="color:#2563eb;font-weight:600">Login Here</a></p>
            <p style="font-size:12px;color:#94a3b8">Are you a property owner? <a href="owner-register.html" style="color:#f59e0b;font-weight:600">Owner Registration</a></p>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="script.js"></script>
<script>
document.addEventListener('DOMContentLoaded', () => {
  populateSelect('rDistrict', TN_DISTRICTS, 'Select District');
  if (Auth.getUser()) window.location.href = 'user-dashboard.html';
});

function togglePwd(id, iconId) {
  const f = document.getElementById(id);
  const i = document.getElementById(iconId);
  f.type = f.type === 'password' ? 'text' : 'password';
  i.className = f.type === 'password' ? 'bi bi-eye-slash' : 'bi bi-eye';
}

function previewPic(input) {
  const file = input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    document.getElementById('picPreview').innerHTML = `<img src="${e.target.result}" style="width:80px;height:80px;border-radius:50%;object-fit:cover;border:3px solid #2563eb"/>`;
  };
  reader.readAsDataURL(file);
}

document.getElementById('regForm').addEventListener('submit', function(e) {
  e.preventDefault();
  const btn = document.getElementById('regBtn');
  const alert = document.getElementById('alertBox');

  const name     = document.getElementById('rName').value.trim();
  const username = document.getElementById('rUsername').value.trim();
  const email    = document.getElementById('rEmail').value.trim();
  const phone    = document.getElementById('rPhone').value.trim();
  const gender   = document.getElementById('rGender').value;
  const dob      = document.getElementById('rDob').value;
  const district = document.getElementById('rDistrict').value;
  const address  = document.getElementById('rAddress').value.trim();
  const password = document.getElementById('rPassword').value;
  const cpass    = document.getElementById('rCPassword').value;
  const terms    = document.getElementById('rTerms').checked;

  if (!name || !username || !email || !phone || !gender || !dob || !district || !password) {
    alert.innerHTML = '<div class="alert alert-danger"><i class="bi bi-exclamation-circle me-2"></i>Please fill in all required fields.</div>';
    return;
  }
  if (!/^\d{10}$/.test(phone)) {
    alert.innerHTML = '<div class="alert alert-danger"><i class="bi bi-exclamation-circle me-2"></i>Enter a valid 10-digit phone number.</div>';
    return;
  }
  if (password.length < 6) {
    alert.innerHTML = '<div class="alert alert-danger"><i class="bi bi-exclamation-circle me-2"></i>Password must be at least 6 characters.</div>';
    return;
  }
  if (password !== cpass) {
    alert.innerHTML = '<div class="alert alert-danger"><i class="bi bi-exclamation-circle me-2"></i>Passwords do not match.</div>';
    return;
  }
  if (!terms) {
    alert.innerHTML = '<div class="alert alert-danger"><i class="bi bi-exclamation-circle me-2"></i>Please accept Terms & Conditions.</div>';
    return;
  }

  const users = DB.get('users');
  if (users.find(u => u.email === email)) {
    alert.innerHTML = '<div class="alert alert-danger"><i class="bi bi-exclamation-circle me-2"></i>Email already registered. <a href="login.html">Login?</a></div>';
    return;
  }
  if (users.find(u => u.username === username)) {
    alert.innerHTML = '<div class="alert alert-danger"><i class="bi bi-exclamation-circle me-2"></i>Username already taken.</div>';
    return;
  }

  btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Creating...';
  btn.disabled = true;

  setTimeout(() => {
    const newUser = { id: Date.now(), name, username, email, phone, gender, dob, district, address, password, profilePic: '', wishlist: [], status: 'Active', joinDate: new Date().toLocaleDateString('en-IN') };
    DB.add('users', newUser);
    Auth.setUser(newUser);
    showToast('Account created successfully! Welcome to House Rental System 🎉');
    setTimeout(() => window.location.href = 'user-dashboard.html', 1000);
  }, 700);
});
</script>
</body>
</html>
